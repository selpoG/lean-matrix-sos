name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          use-github-cache: true
          build-args: MatrixSOS MatrixSOS.Audit MatrixSOS.Examples
      - name: Style lint
        run: lake exe lint-style MatrixSOS MatrixSOS.Audit MatrixSOS.Examples

  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: '3.53.1'
      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            texlive-lang-japanese texlive-latex-extra texlive-fonts-recommended ripgrep
      - name: Build English and Japanese proof PDFs
        run: task pdf
