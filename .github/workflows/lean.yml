name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: true
          build-args: MatrixSOS MatrixSOS.Audit MatrixSOS.Examples
      - name: Style lint
        run: lake exe lint-style MatrixSOS MatrixSOS.Audit MatrixSOS.Examples

  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            texlive-lang-japanese texlive-latex-extra texlive-fonts-recommended ripgrep
      - name: Build English and Japanese proof PDFs
        run: task pdf
