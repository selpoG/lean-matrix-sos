name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: true
          build-args: MatrixSOS MatrixSOS.Audit MatrixSOS.Examples
      - name: Style lint
        run: lake exe lint-style MatrixSOS MatrixSOS.Audit MatrixSOS.Examples
